name: Deploy OpenGalaxy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visualization/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install web dependencies
        working-directory: visualization
        run: npm ci

      - name: Refresh Hugging Face graph data
        working-directory: visualization
        run: python scripts/build_hf_graph.py

      - name: Lint web application
        working-directory: visualization
        run: npm run lint

      - name: Build static GitHub Pages site
        working-directory: visualization
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Normalize vinext static asset layout
        working-directory: visualization
        shell: bash
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          pages_base_path="${NEXT_PUBLIC_BASE_PATH%/}"
          if [[ -n "$pages_base_path" ]]; then
            prefixed_assets="dist/client${pages_base_path}/_next"
            test -d "$prefixed_assets"
            mv "$prefixed_assets" dist/client/_next
            rmdir "dist/client${pages_base_path}"
          fi
          test -f dist/client/index.html
          test -f dist/client/data/graph.json
          test -f dist/client/data/huggingface.json
          test -f dist/client/og.png
          test -d dist/client/_next/static
          galaxy_chunk="$(find dist/client/_next/static/chunks -maxdepth 1 -type f -name 'GalaxyExplorer-*.js' -print -quit)"
          test -n "$galaxy_chunk"
          grep -Fq '/data/graph.json' "$galaxy_chunk"
          grep -Fq '/data/huggingface.json' "$galaxy_chunk"
          if [[ -n "$pages_base_path" ]]; then
            grep -Fq "${pages_base_path}/_next/" dist/client/index.html
            grep -Fq "$pages_base_path" "$galaxy_chunk"
          fi

      - name: Verify rendered HTML
        working-directory: visualization
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run test:rendered

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: visualization/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
